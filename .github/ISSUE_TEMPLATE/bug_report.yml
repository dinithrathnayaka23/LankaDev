name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@lankadev/core"
        - "@lankadev/unicode"
        - "@lankadev/transliteration"
        - "@lankadev/react"
        - "@lankadev/next"
        - Docs / examples
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact input text (Sinhala/Tamil/Latin) and the output you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code snippet, CodeSandbox/StackBlitz link, or a repo.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 24, React 19.3, Next 16.4, Chrome 142, Windows 11"
  - type: markdown
    attributes:
      value: "Please do not paste real personal data (NIC numbers, phone numbers, addresses)."
